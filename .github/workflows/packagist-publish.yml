name: Publish to Packagist

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag being published
        required: true
        type: string
    secrets:
      PACKAGIST_USERNAME:
        required: true
      PACKAGIST_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag being published
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_TOKEN" ]; then
            echo "::error::Missing PACKAGIST_USERNAME and/or PACKAGIST_TOKEN repository secrets."
            exit 1
          fi
          curl --fail-with-body -sS -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${PACKAGIST_USERNAME}:${PACKAGIST_TOKEN}" \
            -d '{"repository":"https://github.com/PonchRobles/inertiajs-tables-laravel-query-builder"}' \
            https://packagist.org/api/update-package
