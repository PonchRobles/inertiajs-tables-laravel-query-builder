name: Feature request
description: Suggest an idea or improvement
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please check that the feature does not already exist and is useful to other users.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the solution you would like, including any API you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Alternatives or workarounds you have considered.
    validations:
      required: false
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a pull request for this feature.
          required: false
